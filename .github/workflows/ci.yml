name: Generic core checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  synthetic-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EDITOR_PROJECT_DIR: examples/studio-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # No deployment, secrets, real project data or artifact uploads belong in this workflow.
